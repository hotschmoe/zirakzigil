name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Matrix (every optimize mode, ghost on and off, freestanding, consumer)
        run: zig build matrix --summary all
      - name: Negative suite
        run: ./tools/run_negative.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: Static verifier (zvc)
        run: |
          pip install z3-solver
          # zvc exits 1 on purpose: the example has two rejected functions.
          python tools/zvc.py examples/search.zig | tee zvc.out || true
          grep -q "4 verified, 2 rejected" zvc.out

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      # --fuzz=<n> stops after n iterations and fails the build on a crash.
      - run: zig build fuzz --fuzz=100K
