name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - id: zigzv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: compiler/.work/zig-src/zig-out/bin/zig-zv*
          key: zig-zv-${{ runner.os }}-${{ hashFiles('compiler/src/**', 'compiler/hook/**', 'compiler/ZIG_VERSION', 'tools/build_zig_zv.sh', 'tools/zv_hook.zig', 'src/air/schema.zig', 'src/air/builder.zig', 'src/air/json.zig', 'src/air/names.zig') }}
      - name: Build zig-zv (the pinned tag plus the patch queue)
        if: steps.zigzv.outputs.cache-hit != 'true'
        run: sh tools/build_zig_zv.sh
      - name: Export every pack from the sources of this commit
        run: |
          lib=$(zig env | sed -n 's/^ *\.lib_dir = "\(.*\)",$/\1/p' | sed 's/\\\\/\//g')
          echo "ZIG_LIB=$lib" >> "$GITHUB_ENV"
          export ZIG_LIB=$lib
          sh tools/zvc_packs.sh
          sh tools/own_packs.sh
      - name: Matrix (every optimize mode, ghost on and off, freestanding, consumer)
        run: zig build matrix --summary all
      - name: Negative suite
        run: ./tools/run_negative.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: Z3 (pinned release, checked against its digest)
        run: echo "ZV_Z3=$(sh tools/install_z3.sh "$RUNNER_TEMP/z3")" >> "$GITHUB_ENV"
      - name: Verifier (zvc) on the fresh packs against its pinned verdicts
        run: sh tools/run_zvc.sh
      - name: Ownership checker (zv-own) on the fresh packs against its pinned verdicts
        run: sh tools/run_own.sh

  hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: The pack reader and its tool build
        run: zig build zv-air
      - name: Every hook anchor resolves exactly once in the pinned Zig tree
        run: |
          git clone --quiet --filter=blob:none https://codeberg.org/ziglang/zig.git upstream
          git -C upstream checkout --quiet "$(awk '$1 == "commit" { print $2 }' compiler/ZIG_VERSION)"
          zig run tools/zv_hook.zig -- check compiler/hook/rules.zon upstream

  # Fuzzing is off in CI: Zig 0.17's fuzz report aborts with "corrupted
  # coverage file ...: pcs_len was zero". Run `zig build fuzz --fuzz=<n>`
  # locally on Linux; re-enable here once the upstream bug is fixed.
