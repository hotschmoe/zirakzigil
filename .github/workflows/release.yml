name: release

# On a tag push (vMAJOR.MINOR.PATCH): builds zig-zv for the pinned Zig tag and the patch queue of that commit,
# and attaches `zig-zv-<zig tag>-<queue hash>-<arch>-<os>.tar.gz` to the release of the tag (a draft is created when the
# release does not exist yet; publishing it is the maintainer's). Consumers fetch these through the lazy dependencies
# of build.zig.zon, which `tools/pin_assets.sh TAG` writes: run it once the assets are attached. A release whose patch
# queue did not change needs no new assets; the pins of the earlier one stay valid (CI checks the hash in their names).
# Z3 is not rebuilt or mirrored: build.zig.zon pins the upstream release by content hash.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zig-zv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - id: zigzv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: compiler/.work/zig-src/zig-out/bin/zig-zv*
          key: zig-zv-${{ runner.os }}-${{ hashFiles('compiler/src/**', 'compiler/hook/**', 'compiler/ZIG_VERSION', 'tools/build_zig_zv.sh', 'tools/zv_hook.zig', 'src/air/schema.zig', 'src/air/builder.zig', 'src/air/json.zig', 'src/air/names.zig') }}
      - name: Build zig-zv (the pinned tag plus the patch queue)
        if: steps.zigzv.outputs.cache-hit != 'true'
        run: sh tools/build_zig_zv.sh
      - name: Package
        run: sh tools/package_zig_zv.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zig-zv-${{ runner.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: zig-zv
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zig-zv-*
          path: dist
          merge-multiple: true
      - name: Attach the assets to the release (a draft when there is none)
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          {
            echo "Assets attached to $GITHUB_REF_NAME. Pin them with \`sh tools/pin_assets.sh $GITHUB_REF_NAME\` and commit build.zig.zon:"
            ls dist
          } >> "$GITHUB_STEP_SUMMARY"
