name: zig-master canary

# Track B variant: builds zig-zv (hook plus reflection dump plus hand adapter) against upstream Zig master,
# then exports the corpus and checks that raw dump plus normalizer reproduce the hand adapter byte for byte.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Build the normalizer with 0.17.0
        run: zig build-exe research/track-b/norm/norm.zig -OReleaseSafe -femit-bin=$RUNNER_TEMP/norm
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: master
      # The tree must match the host nightly: upstream build.zig needs the host std of the same commit.
      - name: Build zig-zv against upstream master
        id: build
        run: |
          set -o pipefail
          sh research/track-b/build.sh master 2>&1 | tee canary.log
      - name: Export the corpus and compare
        id: compare
        run: |
          set -o pipefail
          ZV_BIN=$PWD/research/track-b/.work/master/zig-out/bin/zig-zv-master sh research/track-b/run.sh master corpus out 2>&1 | tee -a canary.log
          $RUNNER_TEMP/norm research/track-b/norm/0.18.zon out/raw out/norm --strict 2>&1 | tee -a canary.log
          diff -r out/v1 out/norm 2>&1 | head -20 | tee -a canary.log
          diff -rq out/v1 out/norm
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Canary: zig-zv no longer builds or exports against Zig master"
          if gh issue list --state open --search "in:title \"$title\"" --json number -q '.[].number' | grep -q .; then
            echo "an open canary issue already exists"
            exit 0
          fi
          {
            echo "The weekly canary failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Last lines of the log:"
            echo
            echo '```'
            tail -n 40 canary.log
            echo '```'
          } > body.md
          gh issue create --title "$title" --body-file body.md
